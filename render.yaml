# ==============================================================================
#                 PocketPay Render Infrastructure Blueprint
# ==============================================================================
# Deploy with one click on Render: https://render.com
# Creates: 1 Web Service (Gunicorn Flask App) + 1 Managed PostgreSQL Database
# ==============================================================================

services:
  # 1. PocketPay Flask Web Service
  - type: web
    name: pocketpay-app
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt && (flask db upgrade || true)"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pocketpay-db
          property: connectionString
      - key: POCKETPAY_ADMIN_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USE_SSL
        value: "False"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: PocketPay <noreply@pocketpay.app>

# 2. Managed PostgreSQL Database
databases:
  - name: pocketpay-db
    databaseName: pocketpay
    user: pocketpay_user
    plan: free
    region: oregon
