<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden — Admin Access Required</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body" style="justify-content:center;align-items:center;padding:2rem">

  <div class="admin-card" style="max-width:520px;text-align:center;padding:3rem 2rem;border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.03)">
    <div style="width:72px;height:72px;border-radius:20px;background:rgba(239,68,68,0.15);color:var(--admin-danger);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem">
      <i data-lucide="shield-alert" style="width:36px;height:36px"></i>
    </div>

    <h1 style="font-size:1.85rem;font-weight:900;margin:0 0 0.5rem;color:#ffffff">403 — Access Denied</h1>
    <p style="color:var(--admin-text-muted);font-size:0.95rem;line-height:1.6;margin:0 0 1.5rem">
      The PocketPay Admin Panel is strictly restricted to authorized administrators.
      Your logged-in account (<code>{{ user_email or 'Guest' }}</code>) does not have administrator privileges.
    </p>

    <div style="display:flex;gap:1rem;justify-content:center">
      <a href="{{ url_for('main.index') }}" class="admin-btn admin-btn-primary">
        <i data-lucide="arrow-left"></i>
        <span>Return to PocketPay App</span>
      </a>
      <a href="{{ url_for('auth.logout') }}" class="admin-btn admin-btn-ghost">
        <i data-lucide="log-out"></i>
        <span>Switch Account</span>
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
