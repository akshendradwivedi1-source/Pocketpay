<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{{ pocket.name }} — PocketPay Pocket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.18), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.12), transparent 45%),
                  #0a0b14;
      color: #e7e9f3;
      font-family: 'Inter', sans-serif;
    }
    .pocket-qr-card {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 20, 36, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 2.25rem 1.75rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(99, 102, 241, 0.2);
      text-align: center;
    }
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 1rem;
    }
    .brand-name {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .pocket-icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: {{ pocket.color or 'linear-gradient(135deg, #6366f1, #ec4899)' }};
      color: white;
      font-size: 1.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }
    .pocket-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 0.35rem;
    }
    .pocket-owner {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 0 0 1.25rem;
    }
    .progress-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.1rem;
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin: 0.75rem 0 0.5rem;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      border-radius: 9999px;
    }
    .pocket-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      color: #94a3b8;
    }
    .pocket-balance {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
    }
    .btn-action-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .pocketpay-btn {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      font-weight: 700;
      padding: 0.95rem;
      border-radius: 14px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="pocket-qr-card">
    <div class="brand-header">
      <div class="brand-logo">P</div>
      <div class="brand-name">Pocket<span style="color:#6366f1">Pay</span></div>
    </div>

    <div class="pocket-icon-badge">
      💰
    </div>
    <h1 class="pocket-title">{{ pocket.name }}</h1>
    <p class="pocket-owner">Dedicated Savings Pocket by {{ owner_name }}</p>

    <div class="progress-section">
      <div class="pocket-stat-row">
        <span>Current Balance</span>
        <span class="pocket-balance">₹{{ "%.2f"|format(pocket.current_balance or 0) }}</span>
      </div>
      {% if target_amount %}
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" style="width: {{ progress_pct }}%;"></div>
      </div>
      <div class="pocket-stat-row" style="font-size: 0.8rem;">
        <span>Goal: ₹{{ "%.2f"|format(target_amount) }}</span>
        <span>{{ "%.0f"|format(progress_pct) }}% achieved</span>
      </div>
      {% endif %}
    </div>

    <div class="btn-action-group">
      <a href="/?view=pocket&pocket_id={{ pocket.id }}" class="pocketpay-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        Open Pocket in PocketPay
      </a>
    </div>
  </div>
</body>
</html>
