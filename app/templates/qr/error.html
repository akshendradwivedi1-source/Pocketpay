<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PocketPay — QR Destination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.1), transparent 45%),
                  #0a0b14;
      color: #e7e9f3;
      font-family: 'Inter', sans-serif;
    }
    .qr-card {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 20, 36, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2.25rem 1.75rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.15);
    }
    .qr-icon-wrap {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.25rem;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .qr-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
      color: #ffffff;
    }
    .qr-sub {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.55;
      margin: 0 0 1.75rem;
    }
    .btn-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="qr-card">
    <div class="qr-icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h1 class="qr-title">{{ error_title or "Invalid QR Code" }}</h1>
    <p class="qr-sub">{{ error_message or "This QR code link is invalid, expired, or has been removed." }}</p>
    <div class="btn-wrap">
      <a href="/" class="btn btn-primary" style="padding: 0.85rem; font-weight: 700; border-radius: 12px; text-decoration: none;">
        Open PocketPay
      </a>
    </div>
  </div>
</body>
</html>
