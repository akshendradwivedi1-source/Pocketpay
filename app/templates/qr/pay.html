<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pay {{ recipient_name }} — PocketPay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.18), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.12), transparent 45%),
                  #0a0b14;
      color: #e7e9f3;
      font-family: 'Inter', sans-serif;
    }
    .pay-card {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 20, 36, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 2.25rem 1.75rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(99, 102, 241, 0.2);
      text-align: center;
    }
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 1rem;
    }
    .brand-name {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .recipient-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      color: white;
      font-size: 1.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.45);
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    .recipient-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 0.35rem;
    }
    .recipient-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.25);
      margin-bottom: 1.5rem;
    }
    .details-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.1rem;
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .details-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.45rem 0;
      font-size: 0.88rem;
    }
    .details-row:not(:last-child) {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .details-label {
      color: #94a3b8;
    }
    .details-value {
      font-weight: 600;
      color: #ffffff;
      font-family: var(--font-mono);
      word-break: break-all;
    }
    .btn-action-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .upi-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-weight: 700;
      padding: 0.95rem;
      border-radius: 14px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .pocketpay-btn {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      font-weight: 700;
      padding: 0.95rem;
      border-radius: 14px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="pay-card">
    <div class="brand-header">
      <div class="brand-logo">P</div>
      <div class="brand-name">Pocket<span style="color:#6366f1">Pay</span></div>
    </div>

    <div class="recipient-avatar">{{ (recipient_name or 'U')[0].upper() }}</div>
    <h1 class="recipient-name">{{ recipient_name }}</h1>
    <div class="recipient-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Verified PocketPay Recipient
    </div>

    <div class="details-box">
      <div class="details-row">
        <span class="details-label">Virtual UPI ID:</span>
        <span class="details-value">{{ upi_id }}</span>
      </div>
      {% if wallet_id %}
      <div class="details-row">
        <span class="details-label">Wallet ID:</span>
        <span class="details-value">{{ wallet_id }}</span>
      </div>
      {% endif %}
    </div>

    <div class="btn-action-group">
      {% if upi_uri %}
      <a href="{{ upi_uri }}" class="upi-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h.01"/><path d="M17 7h.01"/><path d="M7 17h.01"/><path d="M17 17h.01"/></svg>
        Pay with UPI Apps (GPay, PhonePe, Paytm)
      </a>
      {% endif %}
      <a href="/?action=send&recipient={{ upi_id or wallet_id }}" class="pocketpay-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        Pay via PocketPay Wallet
      </a>
    </div>
  </div>
</body>
</html>
